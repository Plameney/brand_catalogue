<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Бренды Пламенея — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F2F4;--surface:#FFFFFF;--ink:#1D1A22;--muted:#686372;--line:#DCDAE2;--accent:#9A2342;--accent-ink:#FFFFFF;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141217;--surface:#1D1A22;--ink:#EEEBF2;--muted:#A49FAD;--line:#34303B;--accent:#E57693;--accent-ink:#1A0E12;--err:#F2B8B5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.logo{font:400 26px/1.1 Prata,Georgia,serif;margin:0}
.sub{font:500 11px/1 "Golos Text",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 22px}
label{display:block;font-weight:500;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.rem{display:flex;gap:8px;align-items:center;margin:12px 0 18px;color:var(--muted);font-size:14px}
button{width:100%;font:600 15px/1 "Golos Text",sans-serif;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:14px;min-height:21px;margin:10px 0 0}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <p class="logo">Пламенея</p>
  <p class="sub">База знаний по брендам</p>
  <label for="pw">Пароль</label>
  <input type="password" id="pw" required autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button type="submit" id="go">Войти</button>
  <p class="err" id="err" role="alert"></p>
</form>

const KEY='plameneya-kb-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveRaw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.s),iterations:P.n},base,256));
}
async function open(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
const toHex=a=>Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');
const fromHex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved&&saved.startsWith(P.s+':')){try{await open(fromHex(saved.split(':')[1]));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');
  err.textContent='';btn.disabled=true;btn.textContent='Проверяю…';
  try{const raw=await deriveRaw(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,P.s+':'+toHex(raw))}catch(_){}}
    await open(raw);
  }catch(x){err.textContent='Неверный пароль. Попробуйте ещё раз.';btn.disabled=false;btn.textContent='Войти';
    try{localStorage.removeItem(KEY)}catch(_){}}
});
</script>
