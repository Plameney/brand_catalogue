<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Бренды Пламенея</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: витрина-справочник — слева указатель брендов, справа карточка; сверху поиск и разделы */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --sunk:#E8E9EE; --ink:#1D1A22; --muted:#686372; --line:#DCDAE2;
  --accent:#9A2342; --accent-ink:#FFFFFF; --accent-soft:#F4E2E7; --gold:#8F7228; --gold-soft:#F2EBD9;
  --ok:#2F7A4F; --ok-soft:#DFF0E5; --bad:#B23A2E; --bad-soft:#F7E0DC; --mark:#F7E08A;
  --display:"Prata",Georgia,"Times New Roman",serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141217; --surface:#1C1920; --sunk:#252129; --ink:#ECE8F0; --muted:#A49EAD; --line:#322D38;
  --accent:#E57693; --accent-ink:#1A0E12; --accent-soft:#3A2028; --gold:#D4B66B; --gold-soft:#332B1A;
  --ok:#7CCB98; --ok-soft:#1E3326; --bad:#F08A7E; --bad-soft:#3A1F1C; --mark:#6B5A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141217; --surface:#1C1920; --sunk:#252129; --ink:#ECE8F0; --muted:#A49EAD; --line:#322D38;
  --accent:#E57693; --accent-ink:#1A0E12; --accent-soft:#3A2028; --gold:#D4B66B; --gold-soft:#332B1A;
  --ok:#7CCB98; --ok-soft:#1E3326; --bad:#F08A7E; --bad-soft:#3A1F1C; --mark:#6B5A12; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.logo{font-family:var(--display);font-size:20px;letter-spacing:.01em;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo small{display:block;font:500 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:0 44px 0 40px;font:inherit;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:14px;top:12px;width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:12px;top:10px;font:500 11px/18px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;min-height:calc(100% - 61px)}
.side{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:calc(61px + env(safe-area-inset-top,0px));height:calc(100vh - 61px - env(safe-area-inset-top,0px));overflow:auto;padding:14px 12px 24px max(12px,env(safe-area-inset-left,0px))}
.side h2{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 8px 8px}
.filter{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 2px 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.letter{font:600 11px/1 var(--body);color:var(--gold);letter-spacing:.08em;margin:12px 8px 4px}
.blist{list-style:none;margin:0;padding:0}
.blist button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14.5px}
.blist button:hover{background:var(--sunk)}
.blist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.blist .dots{margin-left:auto;display:flex;gap:3px}
.blist .score{font-size:11px;color:var(--ok);font-weight:600}
.main{min-width:0;padding-block:28px 64px;padding-left:max(16px,clamp(16px,4vw,48px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,4vw,48px))}
.wrap{max-width:860px}
.mobile-pick{display:none}

/* brand card */
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1.bname{font:400 clamp(34px,5vw,52px)/1.05 var(--display);margin:10px 0 12px;text-wrap:balance}
.words{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.word{font:400 18px/1 var(--display);color:var(--accent)}
.word+.word::before{content:"·";color:var(--muted);margin-right:10px}
.origin{color:var(--muted);max-width:65ch;margin:0 0 16px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05);color:var(--accent-ink)}
.btn svg{width:13px;height:13px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--gold-soft);border-radius:var(--r);padding:16px 18px;margin-bottom:26px}
.hero .gem{width:34px;height:34px;color:var(--gold)}
.hero b{display:block;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.sec{margin:30px 0 0}
.sec>h3{font:400 22px/1.2 var(--display);margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.sec>h3 span{font:500 12px/1 var(--body);color:var(--muted)}
.fields{display:grid;grid-template-columns:190px minmax(0,1fr);border-top:1px solid var(--line)}
.fields dt,.fields dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
.fields dt{font-weight:600;font-size:13.5px;color:var(--muted);padding-right:16px}
.fields dd{max-width:65ch}
.blink{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent);cursor:pointer}
.blink:hover{border-bottom-color:var(--accent)}
.pitch-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pitch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:72ch}
.saydont{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.say,.dont{border-radius:var(--r);padding:14px 16px}
.say{background:var(--ok-soft)} .dont{background:var(--bad-soft)}
.say b{color:var(--ok)} .dont b{color:var(--bad)}
.say b,.dont b{display:block;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.formula{font-weight:500}
.rel{display:grid;gap:14px}
.rel h4{margin:0 0 8px;font-size:13.5px;color:var(--muted);font-weight:600}
.mats{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.mats a{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink)}
.mats a:hover{border-color:var(--accent)}
.mats .ic{width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 10px/1 var(--body);flex:none}
.empty{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.pager button{border:0;background:none;cursor:pointer;color:var(--muted);text-align:left;padding:0}
.pager button:last-child{text-align:right}
.pager button span{display:block;font:400 18px/1.2 var(--display);color:var(--ink)}
.pager button:hover span{color:var(--accent)}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.qprog{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font:400 19px/1.35 var(--display);margin:0 0 6px;text-wrap:balance}
.qsub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 14px;cursor:pointer;font-size:14.5px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;font-size:14px;color:var(--muted)}
.qfoot{display:flex;justify-content:flex-end;margin-top:14px;gap:8px}
.result{text-align:center;padding:10px 0}
.result .big{font:400 54px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}

/* worlds / cases / basics */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.world{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.world h3{font:400 20px/1.2 var(--display);margin:0;display:flex;gap:10px;align-items:center}
.world p{margin:0;font-size:14px}
.world .lbl{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
details.colls{border-top:1px solid var(--line);padding-top:10px}
details.colls summary{cursor:pointer;font:600 11px/1.4 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);list-style-position:outside}
details.colls summary:hover{color:var(--accent)}
.clist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:12px}
.clist li{display:grid;gap:3px}
.clist a.ct{font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.clist a.ct:hover{text-decoration:underline}
.clist a.ct svg,.lead a svg{width:13px;height:13px;flex:none}
.clist p{margin:0;font-size:13.5px;color:var(--muted)}
.clist .chips{margin:4px 0 0}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.occ{margin-top:28px}
.occ h3{font:400 22px/1.2 var(--display);margin:0 0 6px}
.collrow{display:flex;flex-wrap:wrap;gap:6px}
h2.page{font:400 clamp(30px,4vw,42px)/1.1 var(--display);margin:0 0 8px}
.lead{color:var(--muted);max-width:65ch;margin:0 0 24px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.case .kind{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.case h3{font:400 20px/1.25 var(--display);margin:8px 0 8px}
.case .ans{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.list-num{counter-reset:n;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.list-num li{counter-increment:n;display:grid;grid-template-columns:30px 1fr;gap:8px;max-width:72ch}
.list-num li::before{content:counter(n);font:400 18px/1.3 var(--display);color:var(--gold)}
.dna{display:flex;flex-wrap:wrap;gap:8px}
.dna span{font:400 17px/1 var(--display);padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.testgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-bottom:22px}
.tcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tcard:hover{border-color:var(--accent)}
.tcard b{font:400 18px/1.2 var(--display)}
.tcard span{color:var(--muted);font-size:13.5px}

/* search results */
.results{display:grid;gap:10px}
.res{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.res:hover{border-color:var(--accent)}
.res .rt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res .rt b{font:400 18px/1.2 var(--display)}
.res .rt span{font-size:12.5px;color:var(--muted)}
.res p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--mark)}100%{background:transparent}}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobile-pick{display:block;margin-bottom:18px}
  .mobile-pick select{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:0 10px}
  .fields{grid-template-columns:1fr}
  .fields dt{border-bottom:0;padding-bottom:0}
  .saydont{grid-template-columns:1fr}
  .search kbd{display:none}
  .top-in{gap:10px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .tab{white-space:nowrap}
  .top{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <button class="logo" id="home" type="button">Пламенея<small>База знаний по брендам</small></button>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  </nav>
</div></header>

  </aside>

": "vertigo", "f": {"Коллекции в Пламенея": "BUG — фарфоровые броши-жуки; в Пламенея броши BUG №1, №2, №4 и №5.", "Философия": "Синтез архитектуры и ювелирного дизайна: параметрическое проектирование, кинетика и генеративный дизайн. Броши BUG — фарфоровые жуки, у каждого есть реальный прототип (жук-олень, скарабей, голиаф). Белые броши сделаны из костяного фарфора Bone China, чёрные — из фарфора Parian; основа латунная с позолотой или белым родием, роспись золотом и платиной, грани шлифуют вручную. Работы лаборатории выставлялись в Третьяковской галерее и Государственном историческом музее. В Пламенея 4 броши, 3 из них под заказ.", "Главное украшение (Герой бренда)": "Брошь-жук из фарфора.", "3 слова бренда": "Жук, Фарфор, Архитектура.", "С чем сочетать": "С геометрией Ринго, серебром Sarkissian, бижутерией Caviar."}, "site": {"t": "Официальный сайт VERTIGO Jewellery Lab", "u": "https://vertigojwl.com/"}, "catalog": "https://www.plameneya.com/shop/brands/vertigo", "materials": [{"t": "VERTIGO JEWELLERY LAB (PDF)", "u": "https://drive.google.com/file/d/1sDFsR4eAZmtDmy-OQNxYFqycvYCkTjEf/view"}], "origin": "Россия: ювелирная лаборатория основана в июле 2017 года архитектором и дизайнером Викторией Стрижак.", "pairs": ["Ринго", "Sarkissian", "Caviar"], "worlds": ["avant"], "pairedBy": [], "colls": [{"title": "Нестандартные украшения", "url": "https://www.plameneya.com/shop/collections/nestandartnye-ukrasheniya", "n": 3, "world": "avant"}, {"title": "Не как у всех", "url": "https://www.plameneya.com/shop/collections/ne-kak-u-vsekh", "n": 2, "world": "avant"}, {"title": "На черной стороне", "url": "https://www.plameneya.com/shop/collections/na-chernoy-storone", "n": 1, "world": "avant"}, {"title": "Символизм", "url": "https://www.plameneya.com/shop/collections/simvolizm", "n": 1, "world": "avant"}, {"title": "Лимонное золото", "url": "https://www.plameneya.com/shop/collections/limonnoe-zoloto", "n": 1, "world": "color"}]}, {"name": "VESNA", "id": "vesna", "f": {"Философия": "Украшения как способ выразить женственность, уверенность и внутреннюю гармонию. Слоган бренда: «Раскрой себя истинную через украшения Vesna».", "Эстетика": "Женственное золото с бриллиантами: от молодёжных моделей до статусной классики и эксклюзивных украшений.", "Ключевые формы": "Кольца (помолвочные, обручальные, кольца-дорожки, кольца-трансформеры), серьги (моносерьги, вечерние, конго), подвески, кресты, колье, браслеты, пирсинг.", "Материалы и фактуры": "Золото 585 красного, белого, лимонного и комбинированного цвета. Вставки: бриллианты (в том числе коньячные и чёрные), сапфиры, изумруды, рубины, танзаниты.", "Цвет и палитра": "Оттенки золота, белые, коньячные и чёрные бриллианты, синие сапфиры, зелёные изумруды, красные рубины.", "Аргументы для клиента": "Каждое украшение изготавливается вручную и проходит через 33 пары рук; около 1000 новых моделей в год; бриллианты только высоких характеристик от проверенных российских поставщиков; концепция «идеального подарка» — через украшение можно выразить любовь, благодарность, нежность. Целевая аудитория — женщины от 30 лет со средним и выше среднего достатком.", "Главное украшение (Герой бренда)": "Кольцо из золота 585 с бриллиантами: помолвочное кольцо или кольцо-дорожка.", "Клиент бренда": "Женщина, которая отмечает украшением важный момент: помолвку, свадьбу, рождение ребёнка; покупатель подарка.", "3 слова бренда": "Весна, Женственность, Радость.", "С чем сочетать": "С обручальными кольцами Тимофеевъ, цепями Красцветмет.", "Ключевая эмоция": "Радость и весеннее настроение.", "Что рассказать клиенту": "VESNA — костромской ювелирный бренд с собственным производством, более 10 лет на рынке. Бренд работает с золотом 585 разных оттенков, бриллиантами и цветными драгоценными камнями. В ассортименте помолвочные и обручальные кольца, кольца-трансформеры, серьги, подвески и подарки к рождению ребёнка. Изделия бренда прослеживаются в государственной системе ГИИС ДМДК. Девиз бренда: «Vesna — это всегда ДА!».", "Формула" <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const B=D.brands, W=D.worlds;
const byName={},byId={};B.forEach((b,i)=>{b.i=i;byName[b.name]=b;byId[b.id]=b});
const WC={avant:'#7E4FB8',diamond:'#3D7BC4',color:'#C0763A',minimal:'#7E8790',nature:'#4E9A6B',wedding:'#C4527A'};
const wById={};W.forEach(w=>wById[w.id]=w);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('plm_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('plm_'+k,JSON.stringify(v))}catch(e){}}};
const ext='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

// brand-name linking inside text
const aliasList=[];Object.entries(D.aliases).forEach(([n,al])=>al.forEach(a=>aliasList.push([a,n])));
aliasList.sort((a,b)=>b[0].length-a[0].length);
const aliasRe=new RegExp('(?<![\\wА-Яа-яЁё])('+aliasList.map(a=>a[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\wА-Яа-яЁё])','g');
const aliasMap=Object.fromEntries(aliasList);
function linkify(text,self){
  return esc(text).replace(aliasRe,(m)=>{const n=aliasMap[m];if(!n||n===self)return m;return `<a class="blink" data-brand="${byName[n].id}" href="#b-${byName[n].id}">${m}</a>`});
}
function hl(html,term){if(!term)return html;const t=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return html.replace(new RegExp('(?![^<]*>)('+t+')','gi'),'<mark>$1</mark>')}

// sidebar
let wFilter=store.get('wf',null), current=null, view='brands';
function renderChips(){
  $('#wchips').innerHTML=W.map(w=>`<button class="chip" type="button" data-w="${w.id}" aria-pressed="${wFilter===w.id}"><i class="dot" style="background:${WC[w.id]}"></i>${esc(w.title.split(' и ')[0])}</button>`).join('');
}
function renderIndex(){
  const f=$('#flt').value.trim().toLowerCase();
  const sc=store.get('scores',{});
  let list=B.filter(b=>(!f||b.name.toLowerCase().includes(f))&&(!wFilter||b.worlds.includes(wFilter)));
  let html='',last='';
  list.forEach(b=>{const L=b.name[0].toUpperCase();if(L!==last){html+=(last?'</ul>':'')+`<div class="letter">${L}</div><ul class="blist">`;last=L}
    const s=sc[b.id];
    html+=`<li><button type="button" data-brand="${b.id}" aria-current="${current&&current.id===b.id}">${esc(b.name)}<span class="dots">${s!=null?`<span class="score" title="Лучший результат теста">${s}/5</span>`:''}${b.worlds.map(w=>`<i class="dot" style="background:${WC[w]}" title="${esc(wById[w].title)}"></i>`).join('')}</span></button></li>`});
  html+=last?'</ul>':'<p class="empty" style="margin:12px 8px">Ничего не найдено</p>';
  $('#index').innerHTML=html;
}

// views
function setTabs(v){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.view===v?'page':'false'))}
function mobilePick(){return `<div class="mobile-pick"><select id="mpick" aria-label="Выбрать бренд">${B.map(b=>`<option value="${b.id}" ${current&&current.id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`}
const ORDER=[['Характер бренда',['Коллекции в Пламенея','Философия','Эстетика','Ключевые формы','Материалы и фактуры','Цвет и палитра']],['Клиент и эмоция',['Клиент бренда','Ключевая эмоция','Аргументы для клиента']]];
function fieldsHtml(b,keys,term){
  const rows=keys.filter(k=>b.f[k]).map(k=>`<dt>${esc(k)}</dt><dd data-field="${esc(k)}">${hl(linkify(b.f[k],b.name),term)}</dd>`).join('');
  return rows?`<dl class="fields">${rows}</dl>`:'';
}
function showBrand(id,opts={}){
  const b=byId[id]; if(!b)return; current=b; view='brands'; setTabs('brands'); store.set('last',id);
  const term=opts.term||'';
  const f=b.f;
  let h=mobilePick();
  h+=`<div class="eyebrow">${b.worlds.map(w=>esc(wById[w].title)).join(' · ')||'Аксессуары'}</div>`;
  h+=`<h1 class="bname">${esc(b.name)}</h1>`;

function searchIndex(){
  const docs=[];
  B.forEach(b=>{docs.push({kind:'brand',b,field:null,label:'Название',text:b.name});
    if(b.origin)docs.push({kind:'brand',b,field:'origin',label:'Происхождение',text:b.origin});
    Object.entries(b.f).forEach(([k,v])=>docs.push({kind:'brand',b,field:k,label:k,text:v}));
    b.materials.forEach(m=>docs.push({kind:'brand',b,field:null,label:'Материалы',text:m.t}));});
  W.forEach(w=>docs.push({kind:'world',w,label:'Стилевой мир',text:w.title+'. '+w.character+'. '+w.wear+'. '+w.brands.join(', ')}));
  W.forEach(w=>(w.colls||[]).forEach(c=>docs.push({kind:'world',w,label:'Подборка на сайте',text:c.title+'. '+cap(c.desc)+' '+c.brands.map(x=>x.name).join(', ')})));
  (D.occasions||[]).forEach(c=>docs.push({kind:'world',w:{title:'Подборки по поводам'},label:'Подборка на сайте',text:c.title+'. '+cap(c.desc)+' '+c.brands.map(x=>x.name).join(', ')}));
  D.cases.forEach((c,i)=>docs.push({kind:'case',i,label:c.kind,title:c.title,text:c.q+' '+c.a}));
  const s=D.basics;[s.principle,...s.value,...s.rules.map(r=>r[0]+': '+r[1]),s.formula].forEach(t=>docs.push({kind:'basics',label:'Основы',text:t}));
  return docs;
}

// quiz engine
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function others(b,pred,n){return shuffle(B.filter(x=>x!==b&&pred(x))).slice(0,n)}
function mask(text,b){let t=text;(D.aliases[b.name]||[b.name]).forEach(a=>{t=t.split(a).join('[бренд]')});return t}
function sameWorldFirst(b,pred){const sw=B.filter(x=>x!==b&&pred(x)&&x.worlds.some(w=>b.worlds.includes(w)));const rest=B.filter(x=>x!==b&&pred(x)&&!sw.includes(x));return shuffle(sw).concat(shuffle(rest))}
const GEN={
  words(b){if(!b.f['3 слова бренда'])return null;const d=sameWorldFirst(b,x=>x.f['3 слова бренда']).slice(0,3);return{q:`Какому бренду принадлежат три слова: «${b.f['3 слова бренда'].replace(/\.$/,'')}»?`,opts:[b.name,...d.map(x=>x.name)],ans:b.name,why:b,expl:`${b.name}: ${b.f['3 слова бренда']}`}},
  hero(b){const k='Главное украшение (Герой бренда)';if(!b.f[k])return null;const d=sameWorldFirst(b,x=>x.f[k]&&x.f[k]!==b.f[k]).slice(0,3);return{q:`Какое украшение — герой бренда ${b.name}?`,opts:[b.f[k],...d.map(x=>mask(x.f[k],x))].map(o=>mask(o,b)),ans:mask(b.f[k],b),why:b,expl:`Герой ${b.name}: ${b.f[k]}`}},
  origin(b){if(!b.origin||/не указано/.test(b.origin)||b.origin.length<20)return null;const d=others(b,x=>x.origin&&x.origin.length>=20&&!/не указано/.test(x.origin),3);return{q:`О каком бренде это: «${mask(b.origin,b)}»?`,opts:[b.name,...d.map(x=>x.name)],ans:b.name,why:b,expl:`${b.name}: ${b.origin}`}},
  say(b){if(!b.f['Как говорить'])return null;const d=others(b,x=>x.f['Как говорить'],3);return{q:`Какая фраза подходит для презентации ${b.name}?`,opts:[b.f['Как говорить'],...d.map(x=>mask(x.f['Как говорить'],x))].map(o=>mask(o,b)),ans:mask(b.f['Как говорить'],b),why:b,expl:`Не говорите: ${b.f['Как не говорить']||'—'}`}},
  dont(b){if(!b.f['Как не говорить']||!b.f['Как говорить'])return null;return null},
  pairs(b){if(!b.pairs.length)return null;const ok=rnd(b.pairs);const bad=others(b,x=>!b.pairs.includes(x.name)&&!b.pairedBy.includes(x.name)&&!x.worlds.some(w=>b.worlds.includes(w))&&x.name!=='Синика',3);if(bad.length<3)return null;return{q:`С каким брендом рекомендуют сочетать ${b.name}?`,opts:[ok,...bad.map(x=>x.name)],ans:ok,why:b,expl:`${b.name} → ${b.f['С чем сочетать']}`}},
  worlds(b){if(b.worlds.length!==1)return null;const w=wById[b.worlds[0]];const d=shuffle(W.filter(x=>x!==w)).slice(0,3);return{q:`К какому стилевому миру относится ${b.name}?`,opts:[w.title,...d.map(x=>x.title)],ans:w.title,why:b,expl:`${w.title}: ${w.brands.join(', ')}`}},
  client(b){if(!b.f['Клиент бренда'])return null;const d=sameWorldFirst(b,x=>x.f['Клиент бренда']).slice(0,3);return{q:'Какой бренд предложить этому клиенту?',sub:`«${mask(b.f['Клиент бренда'],b)}»`,opts:[b.name,...d.map(x=>x.name)],ans:b.name,why:b,expl:`${b.name}: ${b.f['Ключевая эмоция']?'эмоция — '+b.f['Ключевая эмоция']:b.f['3 слова бренда']}`}},
};
function makeQuiz({brand,types,n,world}){
  const qs=[];const tps=types||['words','hero','origin','say','pairs','worlds','client'];
  if(brand){shuffle(['words','hero','origin','say','pairs','worlds','client']).forEach(t=>{if(qs.length<n){const q=GEN[t](brand);if(q)qs.push(q)}});
    // top up with neighbour questions about this brand's world mates
    let guard=0;while(qs.length<n&&guard++<40){const q=GEN[rnd(['words','hero','client'])](rnd(B.filter(x=>x!==brand&&x.worlds.some(w=>brand.worlds.includes(w)))) ||rnd(B));if(q&&!qs.some(x=>x.q===q.q&&x.sub===q.sub))qs.push(q)}
  } else {let pool=world?B.filter(b=>b.worlds.includes(world)):B;let guard=0;
    while(qs.length<n&&guard++<400){const q=GEN[rnd(tps)](rnd(pool));if(q&&!qs.some(x=>x.q===q.q&&x.sub===q.sub))qs.push(q)}}
  qs.forEach(q=>{q.opts=shuffle([...new Set(q.opts)])});
  return qs;
}
function startQuiz(el,qs,{brandId,title}){
  let i=0,score=0,answered=false;
  function draw(){
    if(!qs.length){el.innerHTML='<p class="empty">Недостаточно данных для теста.</p>';return}
    if(i>=qs.length){
      let note='';
      if(brandId){const sc=store.get('scores',{});if(sc[brandId]==null||score>sc[brandId]){sc[brandId]=Math.round(score/qs.length*5);store.set('scores',sc);renderIndex()}}
      const pct=Math.round(score/qs.length*100);
      note=pct===100?'Отлично, всё верно.':pct>=70?'Хороший результат. Повторите карточки, где были ошибки.':'Стоит перечитать карточки и пройти тест ещё раз.';
      el.innerHTML=`<div class="quiz"><div class="result"><div class="big">${score} / ${qs.length}</div><p>${note}</p><button class="btn primary" type="button" data-again>Пройти ещё раз</button></div></div>`;
      el.querySelector('[data-again]').onclick=()=>{qs=brandId?makeQuiz({brand:byId[brandId],n:5}):makeQuiz(el._cfg||{n:qs.length});i=0;score=0;draw()};
      return}
    const q=qs[i];answered=false;
    el.innerHTML=`<div class="quiz"><div class="qhead"><span class="eyebrow">${title?esc(title)+' · ':''}Вопрос ${i+1} из ${qs.length}</span><span class="eyebrow">Верно: ${score}</span></div><div class="qprog"><i style="width:${i/qs.length*100}%"></i></div><p class="qtext">${esc(q.q)}</p>${q.sub?`<p class="qsub">${esc(q.sub)}</p>`:''}<div class="opts">${q.opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="explain" hidden></div><div class="qfoot" hidden><button class="btn primary" type="button" data-next>${i+1<qs.length?'Дальше':'Результат'}</button></div></div>`;
    el.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{if(answered)return;answered=true;const o=q.opts[+btn.dataset.k];const ok=o===q.ans;if(ok)score++;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k]===q.ans)x.classList.add('right')});if(!ok)btn.classList.add('wrong');
      const ex=el.querySelector('.explain');ex.hidden=false;ex.innerHTML=`${ok?'<b style="color:var(--ok)">Верно.</b>':'<b style="color:var(--bad)">Неверно.</b>'} ${linkify(q.expl||'')} ${q.why&&(!current||current!==q.why)?`<a class="blink" href="#b-${q.why.id}" data-brand="${q.why.id}">Открыть карточку ${esc(q.why.name)}</a>`:''}`;
      el.querySelector('.qfoot').hidden=false;el.querySelector('[data-next]').focus()});
    el.querySelector('[data-next]').onclick=()=>{i++;draw()};
  }
  draw();
}

// routing
function setHash(h){try{history.replaceState(null,'','#'+h)}catch(e){}}
function route(){const h=(location.hash||'').slice(1);
  if(h.startsWith('b-')&&byId[h.slice(2)])return showBrand(h.slice(2));
  if(h==='worlds')return showWorlds(); if(h==='cases')return showCases(); if(h==='tests')return showTests(); if(h==='basics')return showBasics();
  showBrand(store.get('last',B[0].id)in byId?store.get('last',B[0].id):B[0].id);
}
const VIEWS={brands:()=>showBrand(current?current.id:(store.get('last',B[0].id)in byId?store.get('last',B[0].id):B[0].id)),worlds:showWorlds,cases:showCases,tests:showTests,basics:showBasics};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-brand],[data-view],[data-w],[data-case],[data-test],[data-wtest],[data-pitch],[data-jump]');if(!t)return;
  if(t.dataset.jump){e.preventDefault();const el=document.getElementById(t.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.brand){e.preventDefault();$('#q').value='';showBrand(t.dataset.brand,{field:t.dataset.field||null,term:t.classList.contains('res')?lastQ:''});store.set('last',t.dataset.brand);return}
  if(t.dataset.view){e.preventDefault();$('#q').value='';VIEWS[t.dataset.view]();return}
  if(t.dataset.w){wFilter=wFilter===t.dataset.w?null:t.dataset.w;store.set('wf',wFilter);renderChips();renderIndex();return}
  if(t.dataset.case){const a=document.getElementById('ans'+t.dataset.case);a.hidden=!a.hidden;t.textContent=a.hidden?'Показать решение':'Скрыть решение';return}
  if(t.dataset.pitch){document.querySelectorAll('[data-pitch]').forEach(x=>x.setAttribute('aria-pressed',x===t));document.querySelectorAll('[data-pitchbox]').forEach(x=>x.hidden=x.dataset.pitchbox!==t.dataset.pitch);return}
  if(t.dataset.test){const ty=t.dataset.test;const cfg=ty==='mix'?{n:12}:ty==='words'?{types:['words','hero'],n:10}:{types:[ty],n:10};const el=$('#tquiz');el._cfg=cfg;startQuiz(el,makeQuiz(cfg),{title:t.querySelector('b').textContent});el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.wtest){showTests();const cfg={world:t.dataset.wtest,n:10,types:['words','hero','pairs','client','say']};const el=$('#tquiz');el._cfg=cfg;startQuiz(el,makeQuiz(cfg),{title:wById[t.dataset.wtest].title});el.scrollIntoView({block:'start'});return}
});
$('#home').onclick=()=>showBrand(B[0].id);
$('#flt').addEventListener('input',renderIndex);
let st;$('#q').addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>doSearch(e.target.value),120)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';doSearch('')}});
window.addEventListener('hashchange',route);
renderChips();renderIndex();route();
})();
</script>
